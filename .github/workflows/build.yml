name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json

      - name: Install Stream Deck plugin dependencies
        working-directory: streamdeck
        run: npm ci

      - name: Build the board and assemble assets
        working-directory: streamdeck
        run: npm run build

      - name: Bundle exists
        run: test -s assets/com.genova.control-board.sdPlugin/bin/plugin.js

      - name: Validate the Stream Deck plugin
        run: npx --yes @elgato/cli validate assets/com.genova.control-board.sdPlugin

      - name: Package the board
        run: npx --yes @elgato/cli pack assets/com.genova.control-board.sdPlugin

      - name: Tests (Hermes plugin side, assets, install safety)
        run: python3 -m unittest discover -s tests -v

      - uses: actions/upload-artifact@v4
        with:
          name: genova-control-board
          path: "*.streamDeckPlugin"
