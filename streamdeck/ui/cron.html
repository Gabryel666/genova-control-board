<!DOCTYPE html>
<html>
<head lang="fr">
  <meta charset="utf-8" />
  <script src="sdpi-components.js"></script>
  <style>
    .section { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px;
      margin: 12px 0 4px 0; padding-bottom: 2px; border-bottom: 1px solid #333; }
    .hint { font-size: 10px; color: #666; margin-top: 2px; }
    code { color: #9ca3af; }
  </style>
</head>
<body>

  <sdpi-item label="Tâche">
    <sdpi-select setting="jobId" datasource="getCronJobs"
      loading="Chargement des tâches…" placeholder="Choisir une tâche cron">
    </sdpi-select>
  </sdpi-item>

  <sdpi-item label="Libellé">
    <sdpi-textfield setting="label" placeholder="nom de la tâche"></sdpi-textfield>
  </sdpi-item>

  <div class="hint">
    La liste vient de <code>GET /api/cron/jobs</code> : elle suit ce que le
    gateway a réellement planifié. Un clic déclenche la tâche immédiatement
    (<code>POST /api/cron/jobs/&lt;id&gt;/trigger</code>) et la touche affiche le
    statut de la dernière exécution.
  </div>

  <div class="section">Gateway Hermes (commun à toutes les touches)</div>

  <sdpi-item label="URL">
    <sdpi-textfield setting="baseUrl" global placeholder="http://localhost:9119"></sdpi-textfield>
  </sdpi-item>

  <sdpi-item label="Token">
    <sdpi-password setting="token" global placeholder="auto-découvert"></sdpi-password>
  </sdpi-item>

</body>
</html>
